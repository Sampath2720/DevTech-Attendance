name: DevTech CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/devtech-attendance

            git pull

            docker stop devtech-app || true
            docker rm devtech-app || true

            docker build -t devtech-attendance:latest .

            docker run -d \
              --name devtech-app \
              -p 5000:5000 \
              devtech-attendance:latest
